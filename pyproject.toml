[tool.poetry]
name = "symmer"
version = "0.0.12"
description = ""
authors = ["AlexisRalli <rallilex@hotmail.co.uk>", "TimWeaving <weaving.timothy@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11"
qiskit = "^2.0.0"
opt-einsum = "^3.3.0"
quimb = "^1.14.0"
openfermion = "^1.8.0"
numba = "^0.66.0"
setuptools = "^83.0.0"
ncon = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pydocstyle = "^6.1.1"
myst-nb = ">=0.17.2"
pytest = ">=7.2.2"
flake8 = ">=4.0.1"
black = ">=24.3.0"
isort = ">=5.10.1"
sphinx-design = ">=0.5.0,<1"
sphinx-copybutton = "^0.5.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This process \\(pid=.*\\) is multi-threaded, use of fork\\(\\):DeprecationWarning",
]
